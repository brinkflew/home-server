# =============================================================================
# Alerting rules
# -----------------------------------------------------------------------------
# Loaded by apps/prometheus/prometheus.yml from the same read-only mount, so a
# change deploys like everything else: commit, `git pull`,
# `systemctl --user reload prometheus`. Check them BEFORE deploying - a
# malformed file makes the reload fail and silently leaves the old rules
# running, which is safe but is not what you asked for:
#
#   podman exec prometheus promtool check rules /etc/prometheus/rules/*.yml
#
# TWO CONVENTIONS HOLD THROUGHOUT.
#
# `severity` is critical or warning and nothing else. Alertmanager routes on
# it, the bridge maps it to an ntfy priority, and a third value would silently
# fall through to the default route at default priority - visible nowhere.
#
# EVERY ALERT NAMES WHAT TO DO, not just what is true. An alert whose whole
# content is a metric name and a number costs the reader the entire diagnosis
# at the moment they are least able to do it, and that is how a channel stops
# being read. `summary` says what happened; `description` says where to look.
# =============================================================================

groups:
  # ===========================================================================
  # Who watches the watchman
  # ---------------------------------------------------------------------------
  # THIS GROUP IS NOT OPTIONAL AND IT IS FIRST FOR A REASON. Every rule below
  # it reads a series that arrives through node-exporter's textfile collector.
  # If the collector stops, or the scrape stops, those series simply stop
  # existing - and a rule whose expression matches nothing does not fire. The
  # whole battery goes quiet, and quiet is exactly what healthy looks like.
  #
  # This is the same trap bin/verify-host.sh documents about its own timer, and
  # the same one behind the deliberate absence of a `home_server_collector_up 1`
  # sample: a metric that asserts liveness can only be written by something
  # alive, so it reads green for ever after the writer dies.
  # ===========================================================================
  - name: pipeline
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus cannot scrape {{ $labels.job }} ({{ $labels.instance }})"
          description: >-
            Every home_server_* series arrives through node-exporter. While
            this is down the rest of these rules cannot fire at all, so treat
            silence from them as unknown rather than healthy.
            `systemctl --user status node-exporter prometheus`.

      - alert: MetricsCollectorStale
        # DID IT RUN AT ALL. node-exporter dates the file from OUTSIDE the
        # collector, which is the only reason this can be trusted: a check
        # cannot grade its own liveness, and a self-asserted "last run" series
        # would be a third timestamp on top of the two below.
        #
        # THIS USED TO READ last_success AND THAT CONFLATED TWO FAULTS. The
        # collector holds that stamp at its last COMPLETE pass, so once it
        # started carrying forward across a failing source (which is what makes
        # a degraded collector visible at all - see collect-metrics.py's
        # four-state table) this rule would have paged `critical` for one broken
        # source of the twenty-odd, over a description saying every home_server_*
        # series is frozen. They are not: the file is still being rewritten
        # every 30 seconds. MetricsCollectorDegraded below is that case.
        #
        # NOT home_server_metrics_last_ok_timestamp_seconds, WHICH IS A
        # DIFFERENT CLOCK. That one is a fact lifted out of status.json, so it
        # is only refreshed when bin/verify-host.sh runs - hourly. Against a
        # 600s threshold it crosses on every single cycle, and this rule fired
        # four times in its first hour before the names were told apart. Two
        # metrics, both plausibly named, one of them measuring the wrong thing:
        # the same trap as badges.providers under "providers currently usable".
        #
        # The FAST file only. The slow one is deliberately left in place on nine
        # ticks in ten, so its mtime is not a liveness signal.
        expr: >-
          time() - node_textfile_mtime_seconds{file="/textfile/home-server.prom"}
          > 600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "bin/collect-metrics.py has not run for 10 minutes"
          description: >-
            node-exporter is still up, so host vitals continue - but every
            home_server_* series is frozen at its last value, which on a graph
            is indistinguishable from a stable system.
            `journalctl --user -u home-server-metrics -n 50`.

      - alert: MetricsCollectorDegraded
        # RUNNING, BUT HAS NOT COMPLETED A FULL PASS. This is the state that
        # went unreported for two hours on 2026-09-09 while the dashboard said
        # "the metrics collector has never reported" about a collector that was
        # writing 1,876 series every 30 seconds.
        #
        # IT COULD NOT HAVE FIRED BEFORE, whatever the threshold. The collector
        # OMITTED last_success on any failure, and `time() - <absent>` is an
        # empty vector, not a large number - so the one rule watching for a
        # broken collector went silent exactly when it broke. Same family as
        # ContainerRestartLoop reading a counter that resets on every restart.
        #
        # The second clause is what stops a dead collector paging twice for one
        # cause. `and on(instance)` rather than a bare `and` because
        # node_textfile_mtime_seconds carries a `file` label this metric does
        # not, so an unqualified match would find nothing.
        #
        # 900 rather than 600 so the two thresholds cannot trip in one instant,
        # and warning rather than critical because the host vitals are current -
        # what is stale is one source's slice of them.
        #
        # It also covers the case that has no source_up series at all: a WRITE
        # failure. The whole slow tier was lost 278 times in three days to a
        # place name with an umlaut, and nothing but bin/verify-host.sh saw it.
        expr: >-
          (time() - home_server_collector_last_success_timestamp_seconds > 900)
          and on(instance)
          (time() - node_textfile_mtime_seconds{file="/textfile/home-server.prom"}
           < 600)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "bin/collect-metrics.py is running but has not completed a full pass"
          description: >-
            The collector is alive and the host vitals are current, but at least
            one source or one file write has been failing, so part of the
            exposition is frozen while the rest is not.
            `journalctl --user -u home-server-metrics -n 50`.

      - alert: CollectorSourceFailing
        # WHICH source, which is the half neither rule above can name. Sibling
        # of CollectorClientUnavailable further down: that one is "cannot poll
        # this container at all", this one is "polled it and the source raised".
        #
        # This series has existed since the collector did and had NO CONSUMER -
        # no rule here, no check in bin/verify-host.sh - which is why a source
        # that failed every 30 seconds for two hours produced no notification of
        # any kind.
        #
        # 15m, not 5m, and the reason is the slow tier: it runs one tick in ten,
        # so a slow source's verdict is only refreshed every five minutes. The
        # series does not blink between its own runs - the slow .prom is left in
        # place rather than rewritten empty - so a `for:` window is meaningful,
        # but three cycles is the margin that keeps one transient failure from
        # paging.
        expr: home_server_collector_source_up == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "collector source {{ $labels.source }} is failing"
          description: >-
            This source has raised on every run for fifteen minutes, so the
            series it produces are absent rather than zero - and an absent
            series makes every other rule about them unfireable. The source
            prints its own error:
            `journalctl --user -u home-server-metrics -n 50`.

      - alert: VerifyBatteryStale
        # Hourly timer; two hours is one missed run plus margin.
        expr: time() - home_server_verify_last_run_timestamp_seconds > 7200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The health battery has not run for two hours"
          description: >-
            home_server_check_status is frozen, so CheckFailing below cannot
            fire on anything new. `systemctl --user status home-server-verify`.

      - alert: AlertDeliveryFailing
        # Prometheus failing to hand alerts to Alertmanager. NOTE WHAT THIS
        # CANNOT DO: if the delivery path is broken, this alert cannot reach
        # the phone either. It fires so that it is recorded and so that it
        # arrives the moment delivery recovers; the channel that actually
        # covers a dead notifier is the MOTD and container health.
        expr: increase(prometheus_notifications_errors_total[10m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus cannot deliver alerts to Alertmanager"
          description: >-
            Alerts are being evaluated and dropped. Nothing else in this file
            can reach you while it is true. Check alertmanager, then
            ntfy-alertmanager, then ntfy - in that order, it is the direction
            the alert travels.

      - alert: AlertBridgeFailing
        # THE HOP THAT NOTHING WATCHED. AlertDeliveryFailing above covers
        # Prometheus -> Alertmanager, and the chain is four hops long:
        # Prometheus -> Alertmanager -> ntfy-alertmanager -> ntfy -> phone.
        # Everything past the first hop was unmeasured, and the failure mode is
        # documented right there in apps/alertmanager/alertmanager.yml: a
        # password_file naming the read-only mount, where "every container stays
        # healthy, both configs validate, Prometheus is happy, and each
        # notification fails with a 401 that only appears in Alertmanager's own
        # log". This is that 401, as a series.
        #
        # It also covers the case that made the 2026-08-19 outage impossible to
        # reconstruct afterwards: ntfy-alertmanager does not log a webhook it
        # receives, so its journal cannot say whether a page was delivered. This
        # can.
        expr: increase(alertmanager_notifications_failed_total{integration="webhook"}[15m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager cannot reach the ntfy bridge"
          description: >-
            Alerts are grouped and then dropped on the last hop, so nothing in
            this file reaches the phone. Most likely the rendered credential at
            /alertmanager/webhook.pw - a 401 shows only in Alertmanager's log.

      - alert: Watchdog
        # A DEAD MAN'S SWITCH, and the only thing here that can prove the chain
        # end to end. Every other rule proves itself by firing; none of them can
        # prove that a SILENT phone means a healthy stack rather than a broken
        # notifier. This one always fires, so its arrival each day is the proof
        # and its absence is the finding.
        #
        # BE HONEST ABOUT WHAT IT COSTS AND WHAT IT CANNOT DO. It is delivered
        # through the same path it is testing, so it cannot alert on its own
        # failure - a human noticing it stopped is the detector, which is weaker
        # than every other rule here. The external alternative is a third-party
        # cron-monitor holding a URL for this host, and that was not wanted.
        # priority 2 in the bridge: it appears in the notification shade without
        # a sound, once a day.
        expr: vector(1)
        labels:
          severity: heartbeat
        annotations:
          summary: "Alerting is alive"
          description: >-
            Sent once a day through the whole chain. If this stops arriving,
            the chain is broken - not the stack quiet. Check alertmanager, then
            ntfy-alertmanager, then ntfy, in that order.

      - alert: CollectorClientUnavailable
        # AN APPLICATION THE COLLECTOR CANNOT POLL AT ALL, which is a different
        # thing from one that answered with nothing - and the reason this rule
        # exists is that the difference was invisible for months.
        #
        # api_get shelled `curl` inside the target container, and gluetun and
        # jellyseerr ship only wget. Every call against them returned None, each
        # caller guards with `if isinstance(x, dict)`, and so
        # home_server_vpn_info was NEVER ONCE EMITTED while the source kept
        # completing and kept writing source_up 1. Same shape as the shellcheck
        # leg that reported "all checks passed" over 2,224 lines it never read.
        #
        # It belongs in THIS group rather than under degradation because it is a
        # failure of the measuring apparatus, not of the thing measured: every
        # series that endpoint would have produced is silently absent, and an
        # absent series makes every other rule about it unfireable.
        expr: home_server_collector_client_unavailable > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} container(s) have no HTTP client the collector can use"
          description: >-
            An application endpoint cannot be polled at all, so its series are
            absent rather than zero - and nothing else here can alert on a series
            that does not exist. The container name is on stderr:
            `journalctl --user -u home-server-metrics -n 50`.

      - alert: MetricsSeriesBudget
        # metrics.series_count is a WARN and the `metrics` section has no
        # section-wide warn matcher - only capacity, agents and ci do - so
        # CheckFailing (== 3) was the only rule that could ever have carried it
        # and it never could. On 2026-09-09 the store sat 16 series under its
        # own ceiling, having spent 90% of the remaining room in a single day's
        # commit, and nothing anywhere was going to say so.
        #
        # IT BELONGS IN THIS GROUP for CollectorClientUnavailable's reason: the
        # first symptom of an unbounded label is the collector's unit being
        # killed at MemoryMax, which takes every series on the host with it. It
        # is a failure of the apparatus, not of the thing measured.
        #
        # 2h RATHER THAN THE USUAL 30m, and the check's own comment is why: a
        # series that stops receiving samples stays in the head block until it
        # is compacted out, roughly two hours, so every rename counts both names
        # for that long. The rename to upstream container_* names read 3378
        # against a live 2896 - a transient breach that must not page.
        expr: home_server_check_status{id="metrics.series_count"} == 2
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "The metrics store is over its derived series budget"
          description: >-
            The budget is SERIES_BASE + 45 per service in bin/verify-host.sh,
            with ten services of slack, so ordinary growth moves the ceiling
            with itself and only something unexplained breaches it. The check's
            own message says which: a few services' worth is growth, and
            hundreds is a label carrying a path, a title, an id or an address.
            Wait out a rename before acting - both names are counted for about
            two hours.

  # ===========================================================================
  # The battery
  # ===========================================================================
  - name: battery
    rules:
      - alert: CheckFailing
        # ONE RULE COVERS EVERY CHECK AND EVERY FUTURE ONE, because a new
        # check joins home_server_check_status automatically. The id label is
        # stable by charter - bin/verify-host.sh guarantees it and lint-repo.sh
        # asserts uniqueness - while the prose is explicitly not, which is why
        # this alerts on the id and sends the reader to the message rather than
        # trying to carry it.
        expr: home_server_check_status == 3
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Health check {{ $labels.id }} is FAILING"
          description: >-
            Section {{ $labels.section }}. The wording lives in status.json,
            not here: `jq -r '.checks[]|select(.id=="{{ $labels.id }}")'
            /var/lib/home-server/status.json`.

      - alert: OsImageStale
        # THE ONE WARN THAT HAS TO NOTIFY, which is why it needs a rule of its
        # own: CheckFailing is `== 3` and this check is deliberately a WARN. It
        # cannot be a FAIL, because bin/reboot-host.sh and
        # bin/reboot-when-staged.sh both refuse on an unhealthy battery and a
        # stalled updater is not something a reboot fixes - so a FAIL here would
        # block the OS security updates it is complaining about not getting.
        #
        # 6h rather than 30m because staged-but-not-applied is the normal state
        # between the nightly stage and the Sunday reboot window, and this check
        # compares against the STAGED digest when one exists. Firing sooner
        # would alert on the system working as designed.
        expr: home_server_check_status{id="deploy.image_digest"} == 2
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "A newer OS image is published and nothing has staged it"
          description: >-
            rpm-ostree can report "No updates available" with an update waiting -
            observed 2026-08-17, after a `cleanup -r` removed a staged
            deployment. `sudo rpm-ostree upgrade` is the first thing to try;
            failing that, re-resolve the ref with `rpm-ostree rebase` to the
            same image. The digests are in status.json under facts.

      - alert: OsImageLagging
        # THE SIBLING OF OsImageStale, AND DELIBERATELY NOT THE SAME RULE.
        # Widening that expression to match both ids was the obvious economy
        # and it is wrong: its summary says "nothing has STAGED it" and its
        # description recommends `rpm-ostree upgrade`, and both are false here.
        # This fires when staging worked perfectly and nothing APPLIED it - the
        # remedy is /boot space or the reboot window, never the updater. An
        # alert whose annotation names the wrong remedy costs more than the
        # duplicated threshold it saves.
        #
        # The must-not-be-a-FAIL argument above applies unchanged: both reboot
        # paths refuse on an unhealthy battery, so grading this a FAIL would
        # block the update it exists to complain about. It stays a WARN, and
        # this rule is how a WARN reaches a phone.
        #
        # 6h to match its sibling: the check already carries the deadline (14
        # days, or 3 when a critical advisory is staged), so the `for:` here is
        # only guarding against a scrape blip, not re-stating the policy.
        expr: home_server_check_status{id="deploy.image_age"} == 2
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "The host has been running a superseded OS image for too long"
          description: >-
            The newest image IS staged; nothing has applied it. Observed
            2026-09-09 at 21 days with one CRITICAL advisory waiting, after all
            five attempts of the 2026-09-06 window refused for /boot space -
            every check on the host green throughout, because the staged state
            passes and nothing measured how long it had been passing.
            `reboot.window_refused` says why the last window was lost and
            `deploy.boot_free` whether there is room; `bin/reboot-host.sh` is
            the attended route. Age and advisory counts are in status.json under
            facts as image_base_age_days and image_advisories_critical.

      - alert: RebootWindowLost
        # bin/reboot-when-staged.sh exits 0 on every refusal by design - a timer
        # that goes red on a quiet week is a timer people stop reading - so the
        # unit's own status can never carry this. Before 2026-09-09 nothing
        # else did either: five refusals spent a whole week's window and left
        # only journal lines, which nothing grades and which rotate.
        #
        # 6h because a window is a Sunday morning: anything shorter would fire
        # between the five attempts of the same morning, which is the system
        # working. The check itself already waits seven days before warning.
        expr: home_server_check_status{id="reboot.window_refused"} == 2
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "The unattended reboot window has been refusing for over a week"
          description: >-
            A staged deployment was ready and every attempt declined, with
            nothing applied since. The tag naming which gate refused is in
            status.json under facts as window_refused_tag - boot_space,
            encoder_busy, phase_in_flight and ci_in_flight are the ones that
            recur. deploy.image_age says how far behind this has left the host.

      - alert: BootReclaimRefused
        # THE CAUSE OF THE RULE ABOVE, AND UNTIL 2026-09-09 IT HAD NO VOICE AT
        # ALL. bin/reclaim-boot-slot.sh is the "after" the unattended reboot
        # cannot take, and nineteen of its paths are refusals that wrote
        # nothing - so deploy.boot_reclaim read the absence as "has not had to
        # do anything yet" while the reclaim was dying at its own lock and the
        # 2026-09-06 window was being spent five times over for want of the
        # slot it would have freed.
        #
        # A SEPARATE ALERT FROM RebootWindowLost RATHER THAN A LABEL ON IT,
        # because they are two different remedies a week apart. That one says
        # "a window was lost and here is the tag"; this one fires on the
        # Tuesday, while there is still time to clear the condition before the
        # Sunday it would otherwise cost.
        #
        # `deploy` HAS NO SECTION-WIDE WARN MATCHER and that is deliberate -
        # the section carries FAILs CheckFailing already delivers, and a == 2
        # catch-all would newly page for deploy.pinned and deploy.image_tag.
        # So this is targeted, like OsImageStale and OsImageLagging beside it.
        #
        # 2h ON TOP OF THE CHECK'S OWN 6h. The check notes under six hours and
        # warns past it; the timer runs every thirty minutes, so by the time
        # this fires the reclaim has refused for the same reason sixteen times
        # running. Nothing transient survives that.
        expr: home_server_check_status{id="deploy.boot_reclaim"} == 2
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "The /boot reclaim has been refusing for hours and /boot is still short"
          description: >-
            /boot holds two 145.3 MiB slots and an update needs a third
            transiently, so an unreclaimed slot is what makes the Sunday reboot
            window refuse. The tag naming which gate refused is in status.json
            under facts as boot_reclaim_refused_tag; lock_unavailable,
            space_unmodelled, pending_deployment and greenboot_not_green are
            the ones a person has to act on. It clears itself the moment /boot
            has room. journalctl --user -u home-server-boot-reclaim.


      # -----------------------------------------------------------------------
      # The ingress chain. SEVEN TARGETED RULES AND NOT A SECTION MATCHER, which
      # was the obvious economy and is the one OsImageLagging already refuses
      # twenty lines up: these six checks have six different remedies - a
      # dead Gandi PAT, a missing CNAME, a wedged updater - and an alert whose
      # annotation names the wrong one costs more than the duplicated threshold
      # it saves. Every ingress.* check is WARN by construction, because
      # bin/reboot-host.sh refuses to act on a host this battery calls
      # unhealthy and a certificate three weeks out must not block an OS
      # security update; so without these rules the whole section would page
      # nobody, which docs/observability.md calls the silent half of grading
      # something WARN.
      # -----------------------------------------------------------------------
      - alert: TlsRenewalOverdue
        # THE ONE THAT BUYS THE MONTH. Caddy chooses a renewal time per
        # certificate out of Let's Encrypt's ARI window - about thirty days
        # before expiry - and this fires when that time has passed and the
        # certificate on disk has not moved. Everything else here reports the
        # same failure later: TlsCertExpiringSoon sees it three weeks on, and a
        # browser sees it at day zero, on all fifteen hostnames at once.
        #
        # 6h because the check is hourly and a renewal is not instantaneous:
        # Caddy retries, and firing between its attempt and its success would
        # page about the system working.
        expr: home_server_check_status{id="ingress.renewal_due"} == 2
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "Caddy is past the renewal time it chose and the certificate has not moved"
          description: >-
            The DNS-01 renewal is failing about thirty days before anything
            goes dark. `journalctl --user -u caddy` carries the ACME error;
            GANDI_BEARER_TOKEN is the credential it needs and a Gandi PAT can
            expire. Counts are in status.json under facts as
            ingress_renewal_overdue and ingress_certs_present, and
            home_server_ingress_certificate_renewal_overdue names the hosts.
            jq -r '.checks[]|select(.id=="{{ $labels.id }}")'
            /var/lib/home-server/status.json

      - alert: TlsDnsCredentialBroken
        # THE ONE THAT ARRIVES BEFORE THE FAILURE RATHER THAN AFTER IT.
        # TlsRenewalOverdue fires when a renewal has already failed, which is
        # thirty days of warning and is still detection after the fact. This
        # fires when the credential that renewal will need stops being
        # accepted - and on this host that had never been exercised at all:
        # every certificate on disk was its first issuance, so the DNS-01 write
        # had not happened once between 2026-08-11 and the first renewal Caddy
        # scheduled for 2026-10-10.
        #
        # A WRITE PROBE, BECAUSE A READ PROVES THE WRONG HALF. A Gandi PAT
        # carries scopes and DNS-01 needs write; a token that can list the zone
        # and not change it authenticates perfectly and renews nothing.
        # bin/probe-credentials.sh creates a TXT record at a name nothing
        # resolves and removes it again, daily.
        #
        # 12h RATHER THAN THE 6h EVERY OTHER RULE HERE USES. The probe is
        # DAILY, so the check grades a marker that only moves once a day: a 6h
        # window would fire on the first hourly battery after a failure and
        # then again on every one until the next probe, which is the same alert
        # twenty-three times. Twelve means one failed probe has to still be the
        # newest answer half a day later.
        expr: home_server_check_status{id="ingress.dns_credential"} == 2
        for: 12h
        labels:
          severity: warning
        annotations:
          summary: "The DNS-01 credential every certificate renews through is not working"
          description: >-
            Fifteen public hostnames renew over DNS-01 against Gandi and ten of
            them expire within hours of each other, so this is every public
            name going dark together rather than one degrading. Replace the PAT
            with `sops secrets/env.sops.env`, then ./bin/render-env.sh and
            restart caddy. The probe's own sentence is in status.json;
            journalctl --user -u home-server-credential-probe carries the run.
            jq -r '.checks[]|select(.id=="{{ $labels.id }}")'
            /var/lib/home-server/status.json

      - alert: TlsCertExpiringSoon
        # NOT A WIDER TlsRenewalOverdue. That rule reads Caddy's own intent and
        # is silent when the metadata is unreadable; this one reads the
        # certificate itself, so it is the backstop for exactly that case. It
        # is deliberately late - twenty-one days is nine past Caddy's renewal
        # point - because anything earlier would fire every quarter on the
        # ordinary window in which a healthy certificate is being renewed.
        expr: home_server_check_status{id="ingress.cert_expiry"} == 2
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "A certificate is inside three weeks and past Caddy's renewal point"
          description: >-
            Ten of the fifteen expire on one day, so this is not one hostname -
            it is every public name within hours of each other. Read
            ingress.renewal_due first: if it is silent the renewal metadata is
            unreadable rather than the renewal being late. Days remaining are
            in status.json under facts as ingress_cert_expiry_days.
            jq -r '.checks[]|select(.id=="{{ $labels.id }}")'
            /var/lib/home-server/status.json

      - alert: TlsCertExpiringCritical
        # THE ONLY CRITICAL HERE, AND IT READS THE FACT RATHER THAN THE CHECK.
        # The check cannot escalate on its own: a FAIL would block the OS
        # security reboot, which is the argument the whole section is built on.
        # So the severity lives here, where it costs nothing - and it keys on
        # the number rather than the verdict because a verdict has no room left
        # to say "seven days" once it has said "twenty-one".
        #
        # 1h rather than 6h: at this point the remedy window is closing and
        # another six hours of confirmation is six hours of the margin.
        expr: home_server_ingress_cert_expiry_days < 7
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "A certificate expires within a week and the renewal has not run"
          description: >-
            Every public hostname fails its TLS handshake when this reaches
            zero, and nothing about the containers will look wrong - Caddy
            serves an expiring certificate perfectly until the second it
            expires. Fix the ACME path (`journalctl --user -u caddy`,
            GANDI_BEARER_TOKEN) or issue by hand; `podman exec caddy caddy
            reload --config /etc/caddy/Caddyfile` retries issuance without
            downtime.

      - alert: TlsCertMissing
        # A site block whose certificate never issued. It is separate from the
        # two above because the remedy is not the ACME path at all: the usual
        # cause is a hostname added to the Caddyfile whose CNAME was never
        # created, so DNS-01 had nothing to validate against.
        expr: home_server_check_status{id="ingress.cert_coverage"} == 2
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "A Caddyfile site block has no certificate"
          description: >-
            That hostname fails the TLS handshake outright rather than
            degrading. Either its CNAME to the DuckDNS record is missing, so
            DNS-01 could not validate, or the issuance failed - `journalctl
            --user -u caddy` names which. Counts are in status.json under facts
            as ingress_sites_expected and ingress_certs_present.
            jq -r '.checks[]|select(.id=="{{ $labels.id }}")'
            /var/lib/home-server/status.json

      - alert: DdnsUpdateStale
        # duckdns serves no HTTP, so it never reports health and no container
        # signal covers it - the same blind spot unpackerr has, except that
        # every public hostname is a CNAME to the record this updates. A bad
        # token is answered with DuckDNS's own web page rather than an error,
        # which is why the check keys on the newest SUCCESS and this rule keys
        # on the check.
        expr: home_server_check_status{id="ingress.ddns_fresh"} == 2
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "DuckDNS has not accepted an update in far longer than its cycle"
          description: >-
            Nothing breaks until the WAN address changes, and then every public
            hostname points at somebody else - while the LAN keeps working, so
            it is invisible from inside the house. Check DDNS_TOKEN and
            `journalctl --user -u duckdns`. The age is in status.json under
            facts as ingress_ddns_age_s.
            jq -r '.checks[]|select(.id=="{{ $labels.id }}")'
            /var/lib/home-server/status.json

      - alert: PublicDnsBroken
        # The registrar half, which is the one thing here this host does not
        # control. It is a separate rule because the remedy is at Gandi and
        # nothing on the server will fix it.
        expr: home_server_check_status{id="ingress.public_dns"} == 2
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "A public hostname no longer follows the DuckDNS record"
          description: >-
            The CNAME at the registrar is missing or points elsewhere, so that
            name is unreachable from outside however healthy this host is.
            *.avanserv.com belongs to a different machine, so each name needs
            its own CNAME - see docs/networking.md.
            jq -r '.checks[]|select(.id=="{{ $labels.id }}")'
            /var/lib/home-server/status.json
  # ===========================================================================
  # Units and containers
  # ===========================================================================
  - name: containers
    rules:
      - alert: ContainerUnhealthy
        # 0 healthy, 1 starting, 2 unhealthy - and ABSENT where no health check
        # is defined, which is what stops duckdns and unpackerr firing this for
        # ever. Those two serve no HTTP and report no health, and a rule that
        # assumed every container has a status would call them broken
        # permanently. CLAUDE.md names that mistake explicitly.
        expr: home_server_container_health == 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.container }} is unhealthy"
          description: >-
            It is running but failing its own health check, so systemd still
            calls the unit active. `podman inspect {{ $labels.container }}
            --format '{{ "{{" }}json .State.Health{{ "}}" }}'` keeps the last
            five results with their output.

      - alert: UnitRestartLoop
        # THIS RULE COULD NOT FIRE FOR AS LONG AS IT EXISTED. It read
        # home_server_container_restarts_total, which is podman's per-container
        # Restarts field - and a quadlet RECREATES the container on every
        # restart, so the counter resets each time round the loop. It read 0
        # through all 6,224 of pocket-id's restarts on 2026-08-19, during the
        # nine and a half hours it was built to catch.
        #
        # home_server_unit_restarts_total is systemd's NRestarts, which belongs
        # to the unit rather than the container and therefore survives. Keyed on
        # kind so the oneshot .build and .network units cannot contribute.
        expr: >-
          increase(home_server_unit_restarts_total{kind=~"container|pod"}[1h]) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.unit }} has restarted repeatedly"
          description: >-
            A unit stuck restarting is usually Restart=always plus a failure at
            startup, not slow progress. Read the journal rather than waiting -
            the real error scrolls past between restarts. Since 2026-08-19 the
            unit gives up after ~100s and lands in `failed`; if it is still
            looping, something is restarting it from outside.

      - alert: ContainerOOMKilled
        # THE ONE MEMORY EVENT THAT IS UNAMBIGUOUS, and until 2026-09-08 nothing
        # here alerted on it. The kernel killed a process inside a container's
        # cgroup; whether the container then recovered or not, something in it
        # died for want of memory and no other rule in this file would say so.
        # ContainerUnhealthy only fires if the survivor also fails its probe, and
        # AgentSliceOOM/CiSliceOOM watch the two slices rather than the services.
        #
        # `increase(...[1h]) > 0` on a counter, which is the same shape those two
        # use and is correct for an OOM: there is no benign level of it, so a
        # floor above zero would be a decision that some kills do not matter.
        # The gauge resets when the container is recreated, so this is about now.
        expr: increase(home_server_container_memory_events_total{event="oom_kill"}[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "The kernel OOM-killed something in {{ $labels.container }}"
          description: >-
            A process inside this container's cgroup was killed for want of
            memory. The container may still be running and may still be passing
            its health check, so nothing else here reports it. Read
            home_server_container_memory_events_total{container="{{ $labels.container }}"}
            against its MemoryMax, and `systemctl --user show
            {{ $labels.container }}.service -p MemoryHigh -p MemoryMax`.

      - alert: ContainerMemoryStarved
        # PSI `full`: EVERY runnable task in the cgroup delayed on memory, a
        # tenth of the time, for a quarter of an hour. bin/collect-metrics.py
        # publishes this series under the words "The arbiter: real starvation
        # shows here, and a cgroup merely holding cache does not", and until
        # 2026-09-08 it had no consumer anywhere - not here, not on the
        # dashboard, not in the battery.
        #
        # THE SAME EXPRESSION AND THE SAME FLOOR AS /services, deliberately, so
        # the page and the phone cannot disagree about one number - the failure
        # docs/dashboard.md records for `note`, where two surfaces read one
        # measurement and drew it differently. STALL_FAIL in
        # apps/dashboard/src/services.ts is the other copy and carries the
        # derivation: the fleet's worst five-minute window in thirty days is
        # 1.2% of wall time, so 10% is eight times a ceiling it has never
        # approached.
        #
        # `for: 15m` IS WHAT KEEPS A BURST OFF THE PHONE. qbittorrent's 1.2% was
        # one sample; a real starvation does not clear itself in a quarter of an
        # hour, and this must not page for a container that had a bad minute.
        #
        # NOT A REFAULT RATE, which is what the dashboard rule used to be and
        # which fires on ordinary file I/O: measured on this host, a mean of nine
        # of twenty-seven containers at any instant, twenty-five at the peak,
        # with nothing above 91% of its watermark and no OOM kill anywhere.
        expr: rate(container_pressure_memory_stalled_seconds_total[5m]) > 0.10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.container }} is stalled on memory"
          description: >-
            Every runnable task in this cgroup has been waiting on memory for
            more than a tenth of the time, for fifteen minutes. MemoryHigh
            throttles rather than kills, so this can run indefinitely with the
            unit active, the container healthy and nothing else reporting a
            fault. `cat /sys/fs/cgroup$(systemctl --user show
            {{ $labels.container }}.service -p ControlGroup --value)/memory.pressure`,
            and read anon against inactive_file before raising a ceiling.

      - alert: UpdateRolledBack
        # A THIRD WARN THAT HAS TO NOTIFY, for the reason OsImageStale and
        # ProbeBinaryMissing already give: CheckFailing is `== 3` and this check
        # is a WARN whenever the affected unit has recovered on its own.
        #
        # The FAIL half - the service still not active - is carried by
        # CheckFailing and needs nothing here. This covers the quieter half: an
        # upstream image was published that cannot run on this host, podman put
        # the old one back, and everything now reads green. Nothing else would
        # ever mention it, and it will be offered again at midnight.
        expr: home_server_check_status{id="update.rollback"} == 2
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "The last container update rolled back"
          description: >-
            An image would not go healthy and the previous one was restored.
            The stack is running, on yesterday's image, and tonight's run will
            try the same one again. `jq -r '.checks[]|select(.id=="update.rollback")'
            /var/lib/home-server/status.json`.

      - alert: ImageMajorJumped
        # THE SIBLING OF UpdateRolledBack, AND THE CASE IT CANNOT COVER. That
        # rule fires when an image would not go healthy and the previous one was
        # restored - which is the rollback WORKING. This one fires when the
        # rollback had nothing to act on: Jellyfin 10.11 -> 12.0.0 started
        # perfectly and broke only its callers, so `Notify=healthy` was
        # satisfied and three collector sources 401'd in silence.
        #
        # 30m to match its sibling, and for the same reason: the callers may be
        # failing tonight. This is the one finding here that is genuinely
        # time-critical, because the remedy - look at what talks to it - is
        # cheapest before somebody has spent an evening on the symptom.
        #
        # WARN, never FAIL, so it needs a targeted rule: `update` has no
        # section-wide warn matcher, and a FAIL would refuse the next reboot
        # window through bin/reboot-when-staged.sh's battery gate.
        expr: home_server_check_status{id="update.image_major"} == 2
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "A container's MAJOR version changed under a floating tag"
          description: >-
            Eleven images here follow `:latest` because their registries publish
            no rolling major, so this is detection rather than prevention. The
            container is healthy - that is the point, and why auto-update's
            rollback cannot see it. Check what SPEAKS to it: the 10.11 -> 12.0.0
            night was an auth break with every response shape unchanged.
            `jq -r '.checks[]|select(.id=="update.image_major")'
            /var/lib/home-server/status.json` names the container and both
            versions.

      - alert: ProbeBinaryMissing
        # A SECOND WARN THAT HAS TO NOTIFY, for the same reason OsImageStale
        # does: CheckFailing is `== 3` and containers.probe_binaries is
        # deliberately a WARN, because bin/reboot-host.sh refuses to act on an
        # unhealthy battery and a missing probe binary is not something a
        # reboot fixes.
        #
        # THIS IS THE ONE THAT COSTS SIGN-ON IF IT IS MISSED. Pocket ID 2.14.0
        # dropped `curl`; its probe exited 127 against a healthy application,
        # Notify=healthy never fired, and podman auto-update rolled the image
        # back into a schema it could no longer read - nine and a half hours
        # with no sign-on anywhere in the stack. Eighteen quadlets still probe
        # with curl or wget and NONE of those images declares a healthcheck of
        # its own, so the exposure cannot be removed, only watched.
        #
        # 1h rather than 30m, and it is not tuning: the condition only bites at
        # the nightly update, so an hour of grace costs nothing and keeps a
        # container restarting mid-pull from firing this.
        expr: home_server_check_status{id="containers.probe_binaries"} == 2
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "A health probe invokes a binary its image no longer ships"
          description: >-
            The probe will exit 127 against an application that is up, and
            podman auto-update will roll the image back on the next nightly
            run - into a database the newer image may already have migrated.
            status.json names the container and the binary:
            `jq -r '.checks[]|select(.id=="containers.probe_binaries")'
            /var/lib/home-server/status.json`. Fix it before 00:00.

      - alert: SegmentIsolationLost
        # CRITICAL, AND THE SAME ARGUMENT AgentContainmentLost MAKES ONE GROUP
        # DOWN. isolate=true is the only thing keeping FlareSolverr off net-arr,
        # and isolation is NOT free under podman: netavark does not inherit
        # Docker's inter-bridge isolation, so these ten networks created plain
        # are fully routable to one another. That was measured on this host
        # before the option was adopted - a container on net-solver reached
        # Sonarr on net-arr by IP, and so did net-media, net-egress and
        # net-transcode. The topology looked segmented and was flat.
        #
        # THE net SECTION HAS NO WARN MATCHER AND NO RULE OF ANY KIND, so before
        # this the check could only have paged through CheckFailing at == 3 -
        # and it never emits a FAIL, because a FAIL in that battery blocks an OS
        # security update through bin/reboot-host.sh.
        #
        # 30m BECAUSE THE STACK IS RESTARTED DELIBERATELY. Changing a network
        # means stopping every unit attached to it, `podman network rm` and
        # starting again, and the segment is genuinely absent in between - which
        # the check reports as a note, not a warn. Half an hour is comfortably
        # past any hand deploy and nowhere near a week.
        expr: home_server_check_status{id="net.segment_isolation"} == 2
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "A stack network segment is not isolated"
          description: >-
            Either a segment is running without isolate=true - so its bridge is
            routable to every other one - or a unit no longer declares it, which
            means a rebuild from the repository would create it flat. The check
            message names which segments and which of the two it is. A network
            cannot be modified in place: this needs the stack stopped, `podman
            network rm`, then daemon-reload and start. See docs/networking.md.

      - alert: SegmentContainmentLost
        # THE PACKET, NOT THE OPTION. The rule above reads configuration; this
        # reads what bin/verify-segmentation.sh found when it actually dialled a
        # forbidden edge from a throwaway container on the source segment,
        # weekly. Both are needed because they fail differently - the option can
        # be set on a bridge that is not enforcing it, and a unit can be correct
        # about a network that no longer exists.
        #
        # A REFUSED CONNECTION COUNTS AS OPEN HERE, which is the distinction the
        # probe is built around: `timeout` returns 124 for a dropped packet, and
        # a refusal returns fast because the packet ARRIVED and only the port
        # was shut. That is not a blocked edge - it opens the moment anything
        # listens on that port.
        #
        # IT ALSO FIRES WHEN THE PROBE COULD NOT PROVE ITSELF, and that is
        # deliberate rather than noisy. Every way that script can fail makes
        # every forbidden edge read "dropped", so it probes one edge that MUST
        # connect and discards the run when that one does not. A silent
        # instrument reporting perfect isolation is the failure this repository
        # has already recorded once.
        #
        # 30m ON A WEEKLY INPUT, unlike the 12h the other marker-graded rules
        # use. Those grade a degradation; this grades a boundary, and there is
        # no version of "wait half a day" that is right for an edge which should
        # never have been open.
        expr: home_server_check_status{id="net.containment"} == 2
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "A forbidden edge between network segments is reachable"
          description: >-
            The check message names the edges. FlareSolverr reaching the *arr
            apps is the one this exists for - it runs headless Chrome against
            attacker-controlled pages - and the dashboard reaching Prometheus
            directly steps around the /api/v1/admin/* refusal that guards
            delete_series. Verify by hand from a throwaway container by IP,
            never by name: docs/networking.md carries the command.
            journalctl --user -u home-server-verify-segmentation.

  # ===========================================================================
  # Backups
  # ---------------------------------------------------------------------------
  # The thresholds match bin/verify-host.sh deliberately. Two sources of truth
  # disagreeing about when a backup is stale is worse than either alone.
  # ===========================================================================
  - name: backups
    rules:
      - alert: BackupStale
        expr: time() - home_server_backup_local_timestamp_seconds > 172800
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "The local backup is more than 48 hours old"
          description: >-
            config/ is the only part of this system that cannot be rebuilt from
            git. `journalctl --user -u home-server-backup -n 50`.

      - alert: BackupOffsiteStale
        expr: time() - home_server_backup_offsite_timestamp_seconds > 172800
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "The off-site backup is more than 48 hours old"
          description: >-
            The local copy shares a disk with config/ and does not survive it.
            This is the copy that survives the machine.

      - alert: BackupPolicyProofStale
        # NOT "the policy is broken" - "we have not proved it is intact". The
        # nightly probe records a marker only on a CONFIRMED refusal, so a
        # timeout or a DNS failure leaves the old marker rather than claiming
        # either outcome. One unreachable night reads as stale; a real
        # regression surfaces on the second.
        expr: time() - home_server_backup_offsite_policy_ok_timestamp_seconds > 172800
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "The append-only backup policy has not been proved for 48 hours"
          description: >-
            The nightly probe writes a 0-byte object outside locks/ and expects
            the delete to be refused. This does not mean the policy failed - it
            means it has not been confirmed. A policy that silently stops
            working looks exactly like one that works.

      - alert: RestoreNeverProven
        # KEYED ON THE CHECK, NOT ON THE TIMESTAMP, and that is the whole point.
        # Every other rule in this group reads a marker's age - which requires
        # the marker to EXIST. The state this one has to cover is a marker that
        # was never written at all, where there is no series to subtract from
        # time() and a staleness rule stays silent for ever on the one host that
        # has never verified a restore.
        #
        # bin/verify-host.sh already resolves both cases into one WARN, so
        # reading its status covers "overdue" and "never" together. And WARN is
        # why this rule has to exist: CheckFailing is `== 3`, the same gap
        # OsImageStale, ProbeBinaryMissing and UpdateRolledBack each needed
        # their own rule for.
        #
        # A PATTERN AND NOT AN ALTERNATION. This read
        # `backup.restore_(local|offsite)_age` until 2026-09-09, which is a
        # hand-maintained list of ids in a file nothing cross-checks - so the two
        # server-side verifications added that day would have warned in the battery
        # and paged nobody, which is the one failure this rule exists to prevent.
        # Same lesson as bin/lint-repo.sh leg 9: match the shape the producer mints,
        # never enumerate what it has minted so far.
        expr: home_server_check_status{id=~"backup.restore_[a-z_]+_age"} == 2
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.id }} - the backups are not proven to restore"
          description: >-
            A backup is not proven until it has been restored. Four copies are
            graded separately and the id says which. `backup.restore_server_age`
            and `backup.restore_server_offsite_age` are written by timers on the
            host - check `systemctl --user status home-server-verify-restore` and
            `home-server-verify-restore-offsite`, and note that "has EVER been
            recorded" on a rebuilt host means the one-time start in
            host/systemd/README.md was skipped. `backup.restore_local_age` and
            `backup.restore_offsite_age` are the two that need a person: run
            `./bin/verify-restore.sh` from the workstation, and
            `--repo offsite --deep` for the drill that proves the surviving copy is
            reachable without this machine.

      - alert: BackupTsdbSnapshotStale
        expr: time() - home_server_backup_tsdb_snapshot_timestamp_seconds > 172800
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "The metrics store has not been snapshotted for 48 hours"
          description: >-
            Only the metrics history is at risk, not config/ - hence warning.
            A live TSDB cannot be rsynced, so this snapshot is the only way it
            reaches the backup.

      - alert: PreUpdateSnapshotStale
        # THE RESTORE POINT THE ROLLBACK CANNOT PROVIDE. podman auto-update
        # restores the image and cannot un-migrate the database, so
        # bin/pre-update-snapshot.sh runs as ExecStartPre= on
        # podman-auto-update.service at ~00:00 - 21 hours newer than the 03:00
        # backup, which is the gap Pocket ID fell through on 2026-08-19.
        #
        # THE QUIET FAILURE THIS IS FOR: the drop-in not being wired at all, on
        # a rebuilt host where host/systemd/README.md's symlink loop was not
        # re-run. Then the updater runs normally, every container updates, and
        # the only protection against a bad rollback is silently absent. If the
        # UPDATER stopped instead, update.podman_run already says so and says
        # it better.
        #
        # 48h to match the updater's own ceiling in bin/verify-host.sh, so one
        # missed night reads as stale rather than as broken.
        expr: time() - home_server_backup_pre_update_db_timestamp_seconds > 172800
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "No database snapshot has been taken before a container update"
          description: >-
            An unattended update can no longer be undone: a rollback restores
            the image and leaves a migrated schema behind it. Check that
            ~/.config/systemd/user/podman-auto-update.service.d is symlinked to
            host/systemd/podman-auto-update.service.d and that
            bin/pre-update-snapshot.sh runs.

  # ===========================================================================
  # Degradation
  # ---------------------------------------------------------------------------
  # Everything here is a warning, and the thresholds are deliberately slack.
  # These conditions are real but slow, and several of them flap - an indexer
  # or a subtitle provider backing off for an hour is ordinary. The failure
  # mode being designed against is not missing one, it is sending enough of
  # them that the critical ones stop being read.
  # ===========================================================================
  - name: degradation
    rules:
      - alert: SubtitleProvidersAllDown
        # NOT per-provider. Any single provider throttling is routine - a free
        # daily quota runs out most days. The condition that actually matters
        # is that none is usable, which is the state Bazarr was in for months
        # with one provider configured, logging "All providers are throttled"
        # while every container stayed healthy.
        expr: sum(home_server_subtitle_provider_up) == 0
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Every subtitle provider is unusable"
          description: >-
            Bazarr is doing nothing at all, not working slowly. Usually a
            provider quota; check for "All providers are throttled" in
            config/bazarr/log/bazarr.log and consider enabling another.

      - alert: IndexersMostlyDown
        # Threshold rather than any-indexer, for the reason above. Individual
        # indexers back off constantly and most of the causes are somebody
        # else's site being down.
        expr: >-
          sum(home_server_indexer_up) / count(home_server_indexer_up) < 0.5
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "More than half of the indexers are backing off"
          description: >-
            Searching is degraded while everything looks healthy - this signal
            exists precisely because nothing else shows it. Read the Prowlarr
            log before assuming a local cause; measured on 2026-08-15 the
            causes were a dead mirror, duplicate entries and two sites down.

      - alert: MediaSweepStopped
        # THE INSTRUMENT, NOT THE FINDING, AND THE FIRST LIVE SWEEP IS WHY THOSE
        # ARE TWO CHECKS. This fired as MediaKeyframeDrift for about an hour on
        # 2026-09-09 before the first full run came back: the majority of what
        # it had read was flagged, all with one signature - a 10.427s ceiling
        # with scattered sub-second gaps, which is NVENC's 250-frame cap plus
        # adaptive I-frames at scene cuts, i.e. every file transcoded before
        # `-no-scenecut 1` reached the Tdarr flow. That is days of
        # re-transcoding.
        #
        # A BACKLOG MUST NOT PAGE ON A SCHEDULE. update.pin_lag says it plainly:
        # a condition that stays true until somebody does an afternoon's work
        # would have a rule firing on a timer rather than on a change, and it
        # belongs in the MOTD and on the dashboard where a standing obligation
        # is read when somebody is deciding what to do next. So
        # media.keyframe_drift is deliberately UNALERTED, and this covers the
        # half that is genuinely an event: the sweep has stopped running, or it
        # ran and could not measure anything.
        #
        # WITHOUT THE SPLIT THEY WOULD MASK EACH OTHER. One id warning for a
        # backlog looks exactly like one warning because there is no jellyfin
        # container - and a broken instrument hiding behind a real finding is
        # the failure this whole section exists to prevent, arriving from
        # inside it.
        #
        # 12h BECAUSE THE INPUT IS WEEKLY, and the check already waits 17 days
        # before calling a gap abnormal - the ExecCondition can legitimately
        # defer a run while somebody is watching.
        expr: home_server_check_status{id="media.verify_run"} == 2
        for: 12h
        labels:
          severity: warning
        annotations:
          summary: "The library keyframe sweep is not running"
          description: >-
            Either it has never run - the one-time start in
            host/systemd/README.md was skipped, which a Persistent= timer needs
            - or it ran and could not measure anything, or two weekly runs have
            passed with nothing recorded. The check message says which.
            `exit 1` from bin/verify-media.sh means both "files will drift" and
            "there is no jellyfin container", so read media_error rather than
            the exit code. journalctl --user -u home-server-verify-media.

      - alert: FilesystemFillingUp
        expr: >-
          node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.10
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} is below 10% free"
          description: >-
            /var carries the OS, the checkout, config/ and /var/backups on one
            233 GB partition. /boot is 350 MB and cannot be grown - if that is
            the one filling, check for a pinned deployment first.

      - alert: FilesystemAlmostFull
        expr: >-
          node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.mountpoint }} is below 5% free"
          description: >-
            At this point the backup, the metrics store and the databases are
            all at risk of a write failure.

      - alert: CapacityCheckWarning
        # THE CATCH-ALL FOR THE CAPACITY SECTION, on CiCheckWarning's and
        # AgentCheckWarning's precedent: it covers every check added to that
        # section later without a rule change. var_commitment is excluded so the
        # one finding with its own arithmetic pages once rather than twice, at
        # two severities, thirty minutes apart.
        #
        # NOT A CheckFailing SIBLING, and the reason is structural: every check
        # in that section is WARN or NOTE by charter, because bin/reboot-host.sh
        # refuses to act on a host this battery calls unhealthy and a capacity
        # projection weeks out must never hold up an OS security update. `== 3`
        # could therefore never match.
        expr: >-
          home_server_check_status{section="capacity",
            id!="capacity.var_commitment"} == 2
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "Capacity check {{ $labels.id }} is warning"
          description: >-
            Either the /var census has gone stale, or a share of the disk has
            appeared that nothing names. `jq -r '.checks[]|select(.id=="{{ $labels.id }}")'
            /var/lib/home-server/status.json` has the wording, and
            `bin/storage-census.sh --dry-run` prints the breakdown it grades.

      - alert: VarCommitmentExceedsCapacity
        # THE ARITHMETIC NOTHING WAS DOING. Every ceiling on this host was sized
        # against the free space on the day it was written, and no two of them
        # were ever added together - so on 2026-09-09 the artifact store, three
        # CI lanes, the TSDB and the journal between them committed more than the
        # 86 GiB that was left, while every individual check read green.
        #
        # 0.95 IS FilesystemAlmostFull's 0.05 ONE LEVEL UP, and the three
        # constants move together: here, that alert below, and
        # capacity.var_commitment in bin/verify-host.sh.
        #
        # WARNING, NOT CRITICAL, and that is the whole character of it: nothing
        # is broken. It says the ceilings are wrong, weeks before the disk
        # agrees. FilesystemFillingUp and FilesystemAlmostFull are what page when
        # it actually happens.
        #
        # 6h RATHER THAN 30m because the input is hourly - bin/verify-host.sh
        # writes status.json once an hour - so a shorter window evaluates against
        # a single sample and one bad walk becomes a page.
        expr: >-
          home_server_storage_committed_bytes
            > home_server_storage_capacity_bytes * 0.95
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "The configured ceilings on /var exceed 95% of the volume"
          description: >-
            If every capped consumer reached the limit it is configured with,
            /var would cross FilesystemAlmostFull's line. Fix a ceiling rather
            than deleting once by hand - CI_ARTIFACT_KEEP_DAYS,
            GITHUB_RUNNER_LANE_MAX_MB, SystemMaxUse, retention.size - and note
            that whatever is uncapped contributes only what it holds today, so
            this is a floor. topk(5, home_server_var_consumer_bytes) names the
            largest consumers; /system/storage draws them.

      - alert: VarFillPredicted
        # WHAT A LEVEL ALERT STRUCTURALLY CANNOT SAY. FilesystemFillingUp fires
        # at 10% free, which at the 4 GiB/day measured over the 25 days to
        # 2026-09-09 is about fifteen days out, and at the 11 GiB/day of a
        # CI-active week is five. The LEVEL is identical in both cases and only
        # the slope differs - and the slope is what decides whether there is time
        # to fix a ceiling or only time to delete.
        #
        # 6h RANGE, NOT 1h. /var is sawtoothed by the nightly backup staging -
        # 7.8 GiB written and rewritten - and by lane resets, so a 1h window
        # predicts exhaustion every night at 03:00 and recovers by 04:00. 6h
        # spans a whole backup cycle, and `for: 2h` means the prediction has to
        # survive several evaluations of it.
        #
        # 14 DAYS IS THE LEAD TIME THE REMEDIES NEED: the artifact sweep's window
        # is the shortest lever and takes a day to act, an image prune is a
        # maintenance decision, and "raise nothing and accept it" also needs a
        # person.
        expr: >-
          predict_linear(
            node_filesystem_avail_bytes{mountpoint="/var"}[6h],
            14 * 24 * 3600) < 0
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "/var is on course to fill within a fortnight"
          description: >-
            The RATE, not the level - FilesystemFillingUp has not necessarily
            fired. topk(3, deriv(home_server_var_consumer_bytes[24h])) names
            which consumer is doing it and /system/storage draws it stacked. If
            it is ci_artifacts, bin/ci-artifacts-sweep.sh's window is the lever,
            and docs/ci.md records why it must not go below 7 days.

      - alert: PodmanVolumesLeaking
        # THE CONDITION THE NIGHTLY RECLAIM CANNOT REACH. The ExecStartPost= on
        # podman-auto-update.service is `podman image prune -f`; images and
        # volumes are different stores, and nothing on this host had ever removed
        # an orphaned volume. Measured 2026-09-09: 332 of 340, 9,227 MB, oldest
        # four weeks - 171 postgres and 81 valkey data directories from conduct's
        # per-phase datastores, minted by two call sites passing `rm -f` without
        # `-v`.
        #
        # BOTH CONJUNCTS, NEVER EITHER ALONE. A night of recreates legitimately
        # leaves fresh orphans, which is the system working; a leak is orphans
        # that are OLD. 48h is two of podman-auto-update.timer's cycles.
        #
        # WARNING, NEVER CRITICAL: it is reclaimable disk, which is
        # containers.storage_orphans' own argument, and a fourth critical alert
        # for housekeeping is the failure this whole family is about.
        expr: >-
          home_server_storage_volumes_orphaned > 32
            and
          home_server_storage_volumes_orphaned_bytes > 1073741824
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} podman volumes are orphaned and holding disk"
          description: >-
            Anonymous volumes no container references. `podman volume ls --filter
            dangling=true` lists them and `podman volume prune` reclaims. Do NOT
            reach for `prune -a`: the image store's unreferenced half is the
            previous image of each service, which is what podman-auto-update's
            rollback restores. If this returned after being fixed, a `podman rm`
            has lost its `-v` or an image has added a VOLUME nothing covers.

      - alert: DiskHealthFailing
        # SMART's own overall verdict. It is conservative to the point of being
        # late, so a zero here is never a false alarm.
        expr: home_server_disk_health_ok == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "SMART reports {{ $labels.device }} as failing"
          description: >-
            /mnt/media has no redundancy and is deliberately not backed up. If
            this is nvme0 it carries config/ and the local backup, and the
            off-site copy is the one that matters.

      - alert: GpuHot
        expr: home_server_gpu_temperature_celsius > 85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "GPU {{ $labels.gpu }} has been over 85C for 15 minutes"
          description: >-
            Sustained rather than a transcode spike. Check airflow and whether
            two NVENC sessions are running against a queue that is not draining.

  # ===========================================================================
  # The agent fleet
  # ---------------------------------------------------------------------------
  # NOT ONE OF THESE CAN RIDE ON CheckFailing, and the reason is structural
  # rather than an oversight. Every check in the agents section of
  # bin/verify-host.sh is WARN or NOTE by charter - bin/reboot-host.sh refuses to
  # act on a host this battery calls unhealthy, and nothing an agent fleet does
  # wrong is fixed by a reboot - so none of them can ever emit FAIL, and
  # CheckFailing is `== 3`. That is the same gap OsImageStale,
  # ProbeBinaryMissing, UpdateRolledBack and RestoreNeverProven each had to
  # discover for themselves, arriving here as a whole section at once.
  #
  # NOTES ARE SILENT, DELIBERATELY. `== 2` is warn; a NOTE is 1. Every
  # conduct-dependent check NOTEs while the orchestrator is not installed, which
  # is every hour until it ships, and none of that should reach a phone.
  # ===========================================================================
  - name: agents
    rules:
      - alert: AgentContainmentLost
        # CRITICAL RATHER THAN WARNING, on a section that is otherwise all
        # warnings, because these three are the containment itself. The slice is
        # the only ceiling the runners have; isolate=true is the only thing
        # keeping a phase off net-arr; and the fleet root's SELinux label is what
        # a `restorecon -R /var` silently removes, after which every phase dies
        # on a permission error naming SELinux nowhere.
        expr: >-
          home_server_check_status{id=~"agents.(slice_limits|runner_isolation|fleet_root_label)"} == 2
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Agent containment finding: {{ $labels.id }}"
          description: >-
            The fleet may be running with systemd's defaults instead of
            app-agents.slice, with a bridge that is not isolated, or with a
            worktree root nothing can read. `jq -r '.checks[]|select(.id=="{{ $labels.id }}")'
            /var/lib/home-server/status.json` names which.

      - alert: AgentCheckWarning
        # THE CATCH-ALL FOR THE SECTION, and it covers every check added to it
        # later without a rule change - the same property CheckFailing has for
        # FAIL. The three above are excluded so a containment finding pages once
        # rather than twice, thirty minutes apart, at two severities.
        #
        # It is also what carries agents.approvals_pending, which is why there is
        # no ApprovalWaiting rule: that check only warns once an approval has
        # waited twelve hours, so this fires at twelve and a half. A second rule
        # would restate the same threshold in a second place.
        expr: >-
          home_server_check_status{section="agents",
            id!~"agents.(slice_limits|runner_isolation|fleet_root_label)"} == 2
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Agent check {{ $labels.id }} is warning"
          description: >-
            The fleet is degraded rather than contained wrongly. The wording is
            in status.json: `jq -r '.checks[]|select(.id=="{{ $labels.id }}")'
            /var/lib/home-server/status.json`.

      - alert: AgentQuotaRejected
        # FIRES ON A REJECTION AND NOT ON A WARNING, WHICH IS THE WHOLE POINT OF
        # THE GAP. conduct holds the fleet at allowed_warning (1) by default, so
        # ORDINARILY it cannot take the account to a rejection by itself: a 2
        # here means the subscription ran out for some other reason - almost
        # always your own sessions - and the fleet has already stopped on its own.
        #
        # THE ONE CASE WHERE THAT INFERENCE DOES NOT HOLD is a person having
        # lifted the warning hold for the life of a window, which raises the
        # level to `rejected` and lets the fleet spend the headroom deliberately.
        # Then a 2 CAN be the fleet's own doing, and stopping it is a real remedy
        # again. `home_server_agent_quota_override_timestamp_seconds` in the
        # future is what says so, and agents.quota_headroom's message names it -
        # which is why the description below points at that rather than trying to
        # decide it here. Deliberately NOT a second clause on the expression: a
        # rejection is worth knowing about either way, and one that fired only
        # while nobody had asked for it would go silent in exactly the state
        # somebody would most want to be told.
        #
        # SO THE REMEDY IS CONDITIONAL RATHER THAN ABSENT. Under the default,
        # stopping conduct gives nothing back and the fleet has already stopped;
        # under a live override, `conduct control quota_pace` is the thing to do.
        # Either way it tells you YOUR next session will fail, which is worth
        # knowing before you sit down to one.
        #
        # This was home_server_agent_quota_ratio > 0.9 until 2026-08-23, when the
        # source turned out to be unreachable from this host: /api/oauth/usage
        # returns the percentages and answers 403 to the only long-lived
        # credential a headless server can hold. The status is what the API emits
        # on the model call itself.
        #
        # AND THE WINDOW MUST NOT HAVE CLEARED, which is not belt and braces: the
        # status series records what the API last SAID, and it keeps saying it
        # until the next model phase reports something else. So after a rejection
        # expires - and it expires on its own, at a moment the API named - the
        # gauge still reads 2 while the battery passes and conduct is dispatching
        # again. Without the second clause this pages about a limit that came
        # back. Caught by exercising the arm rather than by reading the rule.
        #
        # Both series are unlabelled, so `and` matches on the empty label set -
        # the same note AgentPhaseStuck carries one rule down. A hold with no
        # reset time makes the right-hand series absent and this silent; that
        # case is covered by AgentCheckWarning, since the battery WARNs on it.
        expr: >-
          home_server_agent_quota_status >= 2
          and home_server_agent_quota_resets_timestamp_seconds > time()
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The subscription reported a rate-limit rejection"
          description: >-
            The fleet shares one subscription with your own sessions and holds
            at the warning below this one, so a rejection usually means
            something other than the fleet spent the window. Check
            agents.quota_headroom first: if somebody lifted the warning hold for
            this window, the fleet has been spending it on purpose and
            `conduct control quota_pace` restores the pacing. It clears on its
            own either way; see
            home_server_agent_quota_resets_timestamp_seconds for when.

      - alert: AgentPhaseStuck
        # Both series are unlabelled, so `and` matches on the empty label set.
        # 10800s is twice the phase scope's RuntimeMaxSec: past it the scope that
        # was meant to kill the runner did not, which is a different fault from a
        # phase merely taking a long time.
        expr: >-
          home_server_agent_phase_in_flight == 1
          and (time() - home_server_agent_phase_started_timestamp_seconds) > 10800
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "A phase has been in flight for over three hours"
          description: >-
            The transient scope should have killed it at RuntimeMaxSec. Look for
            a runner that outlived its scope (`podman ps --filter
            label=io.home-server.ephemeral`) and a lease conduct will not
            reclaim.

      - alert: AgentSliceOOM
        # WARNING RATHER THAN CRITICAL, AND THAT IS THE POINT. An OOM inside the
        # slice is the containment working: the kernel enforced a ceiling this
        # repository chose. It fires so the sizing gets revisited rather than the
        # failures being written off as flaky tests - which is exactly what they
        # look like from inside a phase.
        #
        # A kill here may land on a Windmill worker rather than on the phase that
        # caused it: a cgroup OOM picks by badness across the whole subtree, and
        # rootless podman refuses to lower a worker's oom_score_adj.
        expr: increase(home_server_agent_slice_oom_total[1h]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The agent slice OOM-killed a process"
          description: >-
            app-agents.slice hit MemoryMax. Read
            home_server_agent_slice_memory_peak_bytes against
            home_server_agent_slice_memory_max_bytes before assuming a leak - the
            runner is sized to bind before the slice does, so a slice-level kill
            means that ordering no longer holds.

  # ----------------------------------------------------------------------------
  # The CI lanes
  # ----------------------------------------------------------------------------
  # THE SEVENTH GROUP, and it mirrors `agents` deliberately rather than
  # inventing a shape: the same containment/catch-all/OOM triple, at the same
  # severities, for a fleet with the same properties. What is different is what
  # a failure looks like from outside, and that is why the descriptions do not
  # read like the agents ones.
  #
  # A WEDGED CI LANE BREAKS NOTHING A READER CAN SEE. The lane container carries
  # io.home-server.ephemeral, so bin/collect-metrics.py skips it: no container
  # series, no unhealthy status, and the unit stays `active` because the driver
  # is alive and polling. Work just queues on GitHub's side, where nothing on
  # this host is looking. That is the Windmill-worker shape, and it is why these
  # rules lean on the battery's own checks rather than on container health.
  - name: ci
    rules:
      - alert: CiContainmentLost
        # CRITICAL RATHER THAN WARNING, on the AgentContainmentLost precedent and
        # for the same three reasons one tier over. The slice is the only ceiling
        # the lanes have; isolate=true is the only thing keeping a workflow off
        # net-arr; and the lane root's SELinux label is what a `restorecon -R
        # /var` silently removes, after which every job dies on a permission
        # error naming SELinux nowhere.
        #
        # IT MATTERS MORE HERE THAN THERE. A phase runs model-authored code
        # against one repository this household owns. A lane runs whatever is in
        # a pull request against any repository in the organisation's runner
        # group, and the containment is the only thing between that and the rest
        # of this host.
        expr: >-
          home_server_check_status{id=~"ci.(slice_limits|runner_isolation|fleet_root_label)"} == 2
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "CI containment finding: {{ $labels.id }}"
          description: >-
            The CI lanes may be running with systemd's defaults instead of
            app-ci.slice, on a bridge that is not isolated, or against a lane
            root nothing can read. `jq -r '.checks[]|select(.id=="{{ $labels.id }}")'
            /var/lib/home-server/status.json` names which. Until it is resolved,
            stop the lanes rather than leaving them taking jobs:
            `systemctl --user stop home-server-github-runner@1 home-server-github-runner@2`.

      - alert: CiCheckWarning
        # THE CATCH-ALL FOR THE SECTION, and it covers every check added to it
        # later without a rule change - the same property CheckFailing has for
        # FAIL and AgentCheckWarning has one group up. The three above are
        # excluded so a containment finding pages once rather than twice, thirty
        # minutes apart, at two severities.
        #
        # It is what carries ci.runner_version, which is the one check in this
        # section with a DEADLINE rather than a threshold: GitHub stops giving
        # jobs to a runner past its minimum version, and the symptom is a job
        # queueing for ever while the runner shows online and idle. No separate
        # rule, because that check already warns with the whole explanation in
        # its message and a second rule would restate the threshold in a second
        # place.
        expr: >-
          home_server_check_status{section="ci",
            id!~"ci.(slice_limits|runner_isolation|fleet_root_label)"} == 2
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "CI check {{ $labels.id }} is warning"
          description: >-
            A CI lane is degraded rather than contained wrongly. The wording is
            in status.json: `jq -r '.checks[]|select(.id=="{{ $labels.id }}")'
            /var/lib/home-server/status.json`.

      - alert: CiSliceOOM
        # WARNING RATHER THAN CRITICAL, on AgentSliceOOM's argument: an OOM
        # inside the slice is the containment working, and it fires so the sizing
        # gets revisited rather than the failures being written off.
        #
        # WRITTEN OFF AS WHAT, THOUGH, IS THE DIFFERENCE. A phase killed by the
        # kernel looks like a flaky test. A JOB killed by the kernel is reported
        # to GitHub as a failed step with no useful message, and the obvious
        # reading is that somebody's code broke - so this can send a person to
        # debug a pull request that is fine. The per-lane MemoryMax is sized to
        # bind before the slice does; a kill at slice level means that ordering
        # no longer holds, which is a fact about this host and not about the
        # branch.
        expr: increase(home_server_ci_slice_oom_total[1h]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The CI slice OOM-killed a process"
          description: >-
            app-ci.slice hit MemoryMax, and a job will have failed for a reason
            that looks like its own. Read home_server_ci_slice_memory_peak_bytes
            against home_server_ci_slice_memory_max_bytes, and the per-lane
            limits in bin/github-runner.sh against them, before assuming the
            branch is at fault. host/systemd/app-ci.slice's comment asks for
            exactly this measurement.
