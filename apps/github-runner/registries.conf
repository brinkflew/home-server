# ==============================================================================
# The nested podman will not guess a registry, and every services: block depends
# on it doing so
# ------------------------------------------------------------------------------
# THIS FILE IS THE DIFFERENCE BETWEEN `services:` WORKING AND NOT. A workflow
# writes `image: postgres:16-alpine`, unqualified, because Docker resolves an
# unqualified name to Docker Hub. Podman does not.
#
# THE BASE IMAGE'S DEFAULT IS WORSE THAN HAVING NONE, WHICH IS WHY THIS IS AN
# OVERRIDE RATHER THAN AN ADDITION. quay.io/podman/stable ships
#
#   unqualified-search-registries = ["registry.fedoraproject.org",
#                                    "registry.access.redhat.com", "docker.io"]
#   short-name-mode = "enforcing"
#
# and `enforcing` with MORE THAN ONE registry means an unqualified name that
# exists in two places has to be disambiguated by a human - which, with no TTY,
# is a refusal. `postgres:16-alpine` is a Docker Hub image and nothing else, but
# the engine has to try three registries to find that out, and a transient
# failure at any of them becomes a job that cannot find its database.
#
# upskald alone names postgres:16-alpine, redis:7-alpine and
# axllent/mailpit:v1.30.2 that way, in four jobs. Every other repository in the
# organisation will do the same, because that is what the GitHub documentation
# shows.
#
# DOCKER HUB ONLY, DELIBERATELY. A longer list makes an unqualified name
# ambiguous and resolves it by trying each registry in turn, so a typo becomes a
# slow failure and a name that exists in two places becomes a coin toss. Docker
# Hub is what a workflow author means when they write a bare name.
#
# See: apps/github-runner/Dockerfile, apps/github-runner/storage.conf
# ==============================================================================

unqualified-search-registries = ["docker.io"]
