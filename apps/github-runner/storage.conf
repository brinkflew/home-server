# ==============================================================================
# Where the nested podman keeps its layers, and why it is not under $HOME
# ------------------------------------------------------------------------------
# The base image's default puts a rootless store under $HOME, which in a lane
# would land inside the `home/` bind mount - working, but wrong in one way that
# matters: bin/github-runner.sh's disk budget wants to be able to drop tens of
# gigabytes of container images WITHOUT dropping the bun, uv and Playwright
# caches sitting beside them, since those are what make the next job cheap. So
# the store gets a mount of its own.
#
# `rootless_storage_path` IS THE ONE THAT IS READ, AND `graphroot` ALONE IS NOT.
# Measured, with only `graphroot` set: the engine ignored it entirely and tried
# its rootless default -
#
#   Error: creating runtime static files directory
#   "/home/runner/.local/share/containers/storage/libpod": mkdir /home/runner/.local:
#   permission denied
#
# - which is both the wrong location and, because $HOME is a bind mount, an error
# that names neither this file nor the setting it ignored. `graphroot` applies to
# a ROOTFUL engine; a rootless one takes `rootless_storage_path`, and the runner
# here is deliberately rootless. Both are set: the first so a rootful invocation
# cannot silently land somewhere else, the second because it is the one in force.
#
# IT GOES UNDER `[storage]`, NOT `[storage.options]`, and the wrong table is not
# a silent no-op - which is the one merciful thing about it:
#
#   level=warning msg="Failed to decode the keys
#   [\"storage.options.rootless_storage_path\"] from \"/etc/containers/storage.conf\""
#
# The warning names the key and the file, and then podman carries on with its
# default anyway - so the error that FOLLOWS is the permission denial above
# rather than anything about configuration. Read the first line, not the loudest.
#
# NO `mount_program`, DELIBERATELY. podman 5 picks native overlay where the
# kernel offers it, and naming fuse-overlayfs would force the slower path - and
# the fuse path is the one this host's SELinux policy has not been proved to
# allow, since virt_sandbox_use_fusefs is off and a dontaudit rule means such a
# denial arrives with NO AVC logged. Measured on this host, inside a lane:
# `driver=overlay root=/var/lib/nested-storage`. bin/github-runner-smoke.sh
# asserts that rather than hoping, because a silent fall back to `vfs` copies
# every layer at every pull - a working runner that is several times slower to
# start a service, for ever, with nothing saying why.
#
# See: apps/github-runner/Dockerfile, bin/github-runner-smoke.sh
# ==============================================================================

[storage]
driver = "overlay"
graphroot = "/var/lib/nested-storage"
runroot = "/run/nested-storage"
rootless_storage_path = "/var/lib/nested-storage"
