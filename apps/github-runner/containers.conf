# ==============================================================================
# The two settings that make a container run inside a container
# ------------------------------------------------------------------------------
# LIFTED OUT OF THE BASE IMAGE RATHER THAN INVENTED. quay.io/podman/stable ships
# exactly these, at ~/.config/containers/containers.conf for its own user, and
# they are why podman-in-podman works there at all. They are moved to /etc here
# for one reason: a lane bind-mounts an empty directory over $HOME, which MASKED
# the file and produced
#
#   stat /home/runner/.config: no such file or directory
#
# followed by the engine never binding its socket - an error naming a directory
# nobody deleted, about a file nobody wrote. /etc is not on the lane's mounts, so
# nothing can mask it.
#
# WHAT `volumes = ["/proc:/proc"]` DOES, and why it pairs with the invocation.
# An inner container would normally get a fresh /proc, and mounting one inside a
# nested user namespace is refused - `crun: mount `proc` to `proc`: Permission
# denied`. Handing the outer /proc down instead sidesteps the mount entirely.
# That is also why bin/github-runner.sh passes `--security-opt unmask=ALL`: the
# outer /proc has to be un-masked for the one being handed down to be usable,
# because a nested mount namespace cannot lay its own tmpfs over a masked path
# inherited from a more privileged one -
# `crun: mount `tmpfs` to `proc/acpi`: Permission denied`.
#
# `default_sysctls = []` because netavark writes sysctls when it sets up an inner
# network, and the defaults podman would otherwise apply are not writable from
# in here: `netavark: Sysctl error: IO Error: Read-only file system`.
#
# NOTHING ELSE IS SET, DELIBERATELY. The invocation that was measured working on
# this host needed no engine tuning beyond what the base already had, and every
# key added here is one more thing that can diverge from the upstream image on a
# rebuild it never gets tested against.
#
# See: apps/github-runner/Dockerfile, bin/github-runner.sh, docs/ci.md
# ==============================================================================

[containers]
volumes = [
	"/proc:/proc",
]
default_sysctls = []
